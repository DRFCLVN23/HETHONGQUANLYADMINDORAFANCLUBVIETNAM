<script type="module">
    // Kiểm tra Đăng nhập
    function checkAuth() {
        const user = JSON.parse(localStorage.getItem("currentUser"));
        if (!user) {
            window.location.href = "index.html";
            return null;
        }
        return user;
    }

    window.logout = function() {
        localStorage.removeItem("currentUser");
        window.location.href = "index.html";
    };

    window.toggleMenu = function() {
        document.getElementById("sidebar")?.classList.toggle("open");
        document.querySelector(".sidebar-overlay")?.classList.toggle("open");
    };

    // Hàm điều hướng Router có bắt lỗi (Catch Error)
    window.showPage = async function(pageId) {
        const user = checkAuth();
        if (!user) return;

        if (pageId === "settings" && user.role !== "Ban Quản Trị") {
            alert("⛔ Bạn không có quyền truy cập Cài đặt!");
            return;
        }

        document.querySelectorAll(".sidebar nav a").forEach(el => el.classList.remove("active"));
        const menu = document.querySelector(`.sidebar nav a[data-page="${pageId}"]`);
        if (menu) menu.classList.add("active");

        const content = document.getElementById("pageContent");
        document.getElementById("pageTitle").innerText = menu ? menu.innerText : "Dashboard";

        try {
            switch(pageId) {
                case "home":
                    content.innerHTML = `<div class="card"><h3>👋 Xin chào, ${user.name}!</h3><p>Hệ thống Dora Admin 2.0 đã sẵn sàng.</p></div>`;
                    break;

                case "users":
                    const { renderUsersPage } = await import('./js/users.js');
                    content.innerHTML = renderUsersPage(user);
                    break;

                case "notices":
                    const { renderNoticesPage } = await import('./js/notices.js');
                    content.innerHTML = renderNoticesPage(user);
                    break;

                default:
                    content.innerHTML = `<div class="card"><h3>📌 Trang ${pageId}</h3><p>Đang chuẩn bị ở các giai đoạn sau...</p></div>`;
                    break;
            }
        } catch (error) {
            console.error("Lỗi nạp Module:", error);
            content.innerHTML = `
                <div class="card" style="border-left: 4px solid #ef4444;">
                    <h3 style="color: #ef4444;">⚠️ Không thể tải dữ liệu trang này</h3>
                    <p><b>Lý do:</b> Hãy đảm bảo bạn đã tạo file <code>js/${pageId}.js</code> hoặc đang chạy ứng dụng qua Server (Live Server / GitHub Pages) thay vì mở trực tiếp file html.</p>
                </div>`;
        }
    };

    // Khởi tạo hệ thống
    const currentUser = checkAuth();
    if (currentUser) {
        document.getElementById("userName").innerText = currentUser.name;
        document.getElementById("userRole").innerText = currentUser.role;
        window.showPage("home");
    }
</script>
