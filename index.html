<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora Admin 2.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; min-height: 100vh; }

        /* GIAO DIỆN MÀN HÌNH ĐĂNG NHẬP */
        .login-wrapper { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1e293b; }
        .login-card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
        .login-card h2 { color: #0284c7; margin-bottom: 20px; }

        /* GIAO DIỆN DASHBOARD */
        .dashboard { display: none; width: 100%; min-height: 100vh; }
        .sidebar { width: 260px; background: #1e293b; color: #fff; padding: 20px; display: flex; flex-direction: column; min-height: 100vh; transition: 0.3s; }
        .brand { text-align: center; padding-bottom: 20px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
        .brand img { width: 60px; height: 60px; border-radius: 50%; }
        .brand h3 { margin-top: 10px; font-size: 18px; color: #38bdf8; }
        .brand span { font-size: 12px; color: #94a3b8; }
        .sidebar nav { flex: 1; }
        .sidebar nav a { display: block; padding: 12px 15px; color: #cbd5e1; text-decoration: none; border-radius: 8px; margin-bottom: 5px; font-size: 14px; transition: 0.2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: #0284c7; color: #fff; }
        .user-info { padding-top: 15px; border-top: 1px solid #334155; font-size: 13px; }
        .user-info .name { font-weight: bold; color: #f8fafc; }
        .user-info .role { color: #38bdf8; margin-bottom: 10px; }
        .user-info button { width: 100%; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; }

        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .page-header { margin-bottom: 25px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }

        input, select, textarea, button { font-size: 14px; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 10px; width: 100%; }
        button.btn-primary { background: #0284c7; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.btn-primary:hover { background: #0369a1; }
        
        .menu-toggle { display: none; position: fixed; top: 15px; right: 15px; z-index: 1000; background: #0284c7; color: white; border: none; padding: 10px 15px; border-radius: 6px; }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; }

        @media (max-width: 768px) {
            .sidebar { position: fixed; left: -260px; z-index: 999; height: 100%; }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
            .sidebar-overlay.open { display: block; }
        }
    </style>
</head>
<body>

<!-- 1. GIAO DIỆN ĐĂNG NHẬP -->
<div id="loginView" class="login-wrapper">
    <div class="login-card">
        <h2>Dora Admin Login</h2>
        <input type="text" id="loginId" placeholder="Mã tài khoản (VD: BQT001 hoặc NV001)">
        <input type="password" id="loginPass" placeholder="Mật khẩu">
        <button class="btn-primary" onclick="window.login()">Đăng nhập</button>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">Thử nhập Mã: <b>BQT001</b> | MK: <b>123</b></p>
    </div>
</div>

<!-- 2. GIAO DIỆN TRANG QUẢN TRỊ -->
<button class="menu-toggle" onclick="window.toggleMenu()">☰</button>
<div class="sidebar-overlay" onclick="window.toggleMenu()"></div>

<div id="dashboardView" class="dashboard">
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <img src="https://i.postimg.cc/Z57X57Gp/Chua-co-ten-(Logo)-(1).png" alt="Logo" />
            <h3>DORA ADMIN</h3>
            <span>Hệ thống quản trị</span>
        </div>
        <nav>
            <a href="#" data-page="home" class="active" onclick="window.showPage('home')">🏠 Trang chủ</a>
            <a href="#" data-page="users" onclick="window.showPage('users')">👥 Thành viên</a>
            <a href="#" data-page="notices" onclick="window.showPage('notices')">📢 Thông báo</a>
            <a href="#" data-page="documents" onclick="window.showPage('documents')">📄 Văn bản</a>
            <a href="#" data-page="tests" onclick="window.showPage('tests')">📝 Test kỹ năng</a>
            <a href="#" data-page="feedback" onclick="window.showPage('feedback')">💬 Góp ý</a>
            <a href="#" data-page="games" onclick="window.showPage('games')">🎮 Game</a>
            <a href="#" data-page="settings" onclick="window.showPage('settings')">⚙️ Cài đặt</a>
            <a href="#" data-page="profile" onclick="window.showPage('profile')">👤 Hồ sơ</a>
        </nav>
        <div class="user-info">
            <div class="name" id="userName">...</div>
            <div class="role" id="userRole">...</div>
            <button onclick="window.logout()">🚪 Đăng xuất</button>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header">
            <h2 id="pageTitle">Trang chủ</h2>
        </div>
        <div id="pageContent"></div>
    </main>
</div>

<!-- FIREBASE SDK & APP LOGIC -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        databaseURL: "https://dora-admin-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // XỬ LÝ ĐĂNG NHẬP
    window.login = function() {
        const id = document.getElementById("loginId").value.trim();
        const pass = document.getElementById("loginPass").value.trim();

        if (!id) return alert("Vui lòng nhập Mã tài khoản!");

        // Giả lập logic đăng nhập (Có thể thay bằng query Firebase)
        let user;
        if (id.startsWith("BQT")) {
            user = { id: id, name: "Ban Quản Trị (" + id + ")", role: "Ban Quản Trị" };
        } else {
            user = { id: id, name: "Thành viên (" + id + ")", role: "Member" };
        }

        // Lưu vào LocalStorage
        localStorage.setItem("currentUser", JSON.stringify(user));
        initApp();
    };

    // XỬ LÝ ĐĂNG XUẤT (Chuyển hẳn về giao diện Đăng nhập)
    window.logout = function() {
        localStorage.removeItem("currentUser");
        document.getElementById("dashboardView").style.display = "none";
        document.getElementById("loginView").style.display = "flex";
        document.getElementById("loginId").value = "";
        document.getElementById("loginPass").value = "";
    };

    // KIỂM TRA TRẠNG THÁI KHỞI TẠO
    function initApp() {
        const currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (currentUser) {
            document.getElementById("loginView").style.display = "none";
            document.getElementById("dashboardView").style.display = "flex";
            document.getElementById("userName").innerText = currentUser.name;
            document.getElementById("userRole").innerText = currentUser.role;
            window.showPage("home");
        } else {
            document.getElementById("loginView").style.display = "flex";
            document.getElementById("dashboardView").style.display = "none";
        }
    }

    // NAVIGATION
    window.showPage = function(pageId) {
        const user = JSON.parse(localStorage.getItem("currentUser"));
        if (!user) return window.logout();

        if (pageId === "settings" && user.role !== "Ban Quản Trị") {
            alert("⛔ Bạn không có quyền truy cập Cài đặt!");
            return;
        }

        document.querySelectorAll(".sidebar nav a").forEach(el => el.classList.remove("active"));
        const menu = document.querySelector(`.sidebar nav a[data-page="${pageId}"]`);
        if (menu) menu.classList.add("active");

        const content = document.getElementById("pageContent");
        document.getElementById("pageTitle").innerText = menu ? menu.innerText : "Dashboard";

        switch(pageId) {
            case "home": content.innerHTML = `<div class="card"><h3>Chào mừng ${user.name}</h3><p>Hệ thống Dora Admin đã sẵn sàng.</p></div>`; break;
            case "users": content.innerHTML = `<div class="card"><h3>Quản lý Thành viên</h3></div>`; break;
            case "notices": content.innerHTML = `<div class="card"><h3>Thông báo nội bộ</h3></div>`; break;
            case "documents": content.innerHTML = `<div class="card"><h3>Văn bản</h3></div>`; break;
            case "tests": content.innerHTML = `<div class="card"><h3>Test Kỹ Năng</h3></div>`; break;
            case "feedback": content.innerHTML = `<div class="card"><h3>Góp ý</h3></div>`; break;
            case "games": content.innerHTML = `<div class="card"><h3>Game Doraemon Run</h3></div>`; break;
            case "settings": content.innerHTML = `<div class="card"><h3>Cài đặt</h3><button class="btn-primary" onclick="window.backupData()">Backup JSON</button></div>`; break;
            case "profile": content.innerHTML = `<div class="card"><h3>Hồ sơ cá nhân</h3><p>Mã: ${user.id}</p><p>Quyền: ${user.role}</p></div>`; break;
        }
    };

    window.toggleMenu = function() {
        document.getElementById("sidebar").classList.toggle("open");
        document.querySelector(".sidebar-overlay").classList.toggle("open");
    };

    // BACKUP FUNCTION
    window.backupData = async function() {
        try {
            const snap = await get(ref(db));
            if (!snap.exists()) return alert("Không có dữ liệu!");
            const a = document.createElement("a");
            a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(snap.val(), null, 4));
            a.download = "backup_" + new Date().toISOString().slice(0, 10) + ".json";
            document.body.appendChild(a);
            a.click();
            a.remove();
        } catch (e) { alert("Lỗi backup!"); }
    };

    // Chạy kiểm tra đăng nhập khi vừa tải trang
    initApp();
</script>

</body>
</html>
