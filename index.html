<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Dora Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1e293b; color: #333; }
        .login-card { background: #fff; padding: 35px 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .login-card img { width: 70px; height: 70px; margin-bottom: 15px; border-radius: 50%; }
        .login-card h2 { color: #0284c7; margin-bottom: 20px; font-size: 22px; }
        input { font-size: 14px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px; width: 100%; outline: none; }
        input:focus { border-color: #0284c7; }
        button { font-size: 14px; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .note { font-size: 12px; color: #64748b; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="https://i.postimg.cc/Z57X57Gp/Chua-co-ten-(Logo)-(1).png" alt="Logo">
    <h2>Dora Admin Login</h2>
    <input type="text" id="loginId" placeholder="Mã tài khoản (VD: BQT001 hoặc NV001)">
    <input type="password" id="loginPass" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập</button>
    <div class="note">
        <p>💡 Thử nhập mã bắt đầu bằng <b>BQT</b> (VD: <i>BQT001</i>) để vào quyền <b>Ban Quản Trị</b></p>
    </div>
</div>

<script>
    // Kiểm tra xem đã đăng nhập chưa, nếu rồi thì sang admin.html
    if (localStorage.getItem("currentUser")) {
        window.location.replace("./admin.html");
    }

    function login() {
        const id = document.getElementById("loginId").value.trim();
        if (!id) return alert("Vui lòng nhập Mã tài khoản!");

        let user;
        if (id.toUpperCase().startsWith("BQT")) {
            user = { id: id.toUpperCase(), name: "Ban Quản Trị (" + id.toUpperCase() + ")", role: "Ban Quản Trị" };
        } else {
            user = { id: id.toUpperCase(), name: "Thành viên (" + id.toUpperCase() + ")", role: "Member" };
        }

        localStorage.setItem("currentUser", JSON.stringify(user));
        // Dùng đường dẫn tương đối an toàn cho GitHub Pages
        window.location.replace("./admin.html");
    }
</script>

</body>
</html>
