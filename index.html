<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Dora Admin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1e293b; color: #333; }
        .login-card { background: #fff; padding: 30px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; }
        .login-card img { width: 70px; margin-bottom: 15px; }
        .login-card h2 { color: #0284c7; margin-bottom: 20px; font-size: 22px; }
        input { font-size: 14px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 12px; width: 100%; outline: none; }
        button { font-size: 14px; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>

<div class="login-card">
    <img src="https://i.postimg.cc/Z57X57Gp/Chua-co-ten-(Logo)-(1).png" alt="Logo">
    <h2>Dora Admin Login</h2>
    <input type="text" id="loginId" placeholder="Mã tài khoản (VD: BQT001 hoặc NV001)">
    <input type="password" id="loginPass" placeholder="Mật khẩu">
    <button onclick="login()">Đăng nhập</button>
</div>

<script>
    // Nếu đã đăng nhập trước đó thì vào thẳng admin.html
    if (localStorage.getItem("currentUser")) {
        window.location.href = "admin.html";
    }

    function login() {
        const id = document.getElementById("loginId").value.trim();
        const pass = document.getElementById("loginPass").value.trim();

        if (!id) return alert("Vui lòng nhập Mã tài khoản!");

        // Phân quyền theo mã
        let user;
        if (id.startsWith("BQT")) {
            user = { id: id, name: "Ban Quản Trị (" + id + ")", role: "Ban Quản Trị" };
        } else {
            user = { id: id, name: "Thành viên (" + id + ")", role: "Member" };
        }

        // Lưu thông tin và chuyển sang trang admin
        localStorage.setItem("currentUser", JSON.stringify(user));
        window.location.href = "admin.html";
    }
</script>

</body>
</html>
